
trigger:
  branches:
    include:
      - main

pool:
  name: 'default'

variables:
  buildConfiguration: 'Release'
  imageName: 'dotnet5crud'
  imageTag: '$(Build.BuildId)'
  dockerHubUsername: 'khaliddocker1205'
  dockerHubServiceConnection: 'DockerHubConnection'
  openshiftServer: 'https://api.rm2.thpm.p1.openshiftapps.com:6443'
  openshiftProject: 'khalid-ansari-dev'
  ocExe: 'C:\oc\oc.exe'

steps:
# 1. Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# 2. Verify .NET and Docker
- task: PowerShell@2
  displayName: 'Verify build tools'
  inputs:
    targetType: 'inline'
    script: |
      dotnet --version
      if ($LASTEXITCODE -ne 0) {
        throw "Unable to run .NET SDK."
      }

      docker version
      if ($LASTEXITCODE -ne 0) {
        throw "Docker Engine is not accessible."
      }

# 3. Restore NuGet packages
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: 'DotNet5Crud.csproj'

# 4. Build the .NET application
- task: DotNetCoreCLI@2
  displayName: 'Build .NET application'
  inputs:
    command: 'build'
    projects: 'DotNet5Crud.csproj'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# 5. Build and push the Docker image using the service connection
- task: Docker@2
  displayName: 'Build and push image to Docker Hub'
  inputs:
    containerRegistry: '$(dockerHubServiceConnection)'
    repository: '$(dockerHubUsername)/$(imageName)'
    command: 'buildAndPush'
    Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)'
    tags: |
      $(imageTag)
      latest

# 6. Deploy to OpenShift
- task: PowerShell@2
  displayName: 'Deploy image to OpenShift'
  inputs:
    targetType: 'inline'
    script: |
      $ErrorActionPreference = 'Stop'

      $oc = "$(ocExe)"
      $image = "docker.io/$(dockerHubUsername)/$(imageName):$(imageTag)"

      if (-not (Test-Path $oc)) {
        throw "OpenShift CLI not found at $oc"
      }

      if ([string]::IsNullOrWhiteSpace($env:OPENSHIFT_TOKEN)) {
        throw "OPENSHIFT_TOKEN is missing. Configure it as a secret pipeline variable."
      }

      # Log in to OpenShift
      & $oc login `
        --server="$(openshiftServer)" `
        --token="$env:OPENSHIFT_TOKEN"

      if ($LASTEXITCODE -ne 0) {
        throw "OpenShift login failed."
      }

      # Select project
      & $oc project "$(openshiftProject)"
      if ($LASTEXITCODE -ne 0) {
        throw "Could not access OpenShift project."
      }

      # Create or update the deployment
      & $oc get deployment dotnet5crud *> $null
      $deploymentExists = ($LASTEXITCODE -eq 0)

      if ($deploymentExists) {
        Write-Host "Updating deployment to $image"

        & $oc set image deployment/dotnet5crud `
          dotnet5crud="$image"

        if ($LASTEXITCODE -ne 0) {
          throw "Failed to update deployment image."
        }
      }
      else {
        Write-Host "Creating application from $image"

        & $oc new-app `
          --image="$image" `
          --name=dotnet5crud

        if ($LASTEXITCODE -ne 0) {
          throw "Failed to create application."
        }
      }

      # Wait until the Deployment exists
      & $oc rollout status deployment/dotnet5crud --timeout=180s

      if ($LASTEXITCODE -ne 0) {
        & $oc get pods
        & $oc logs deployment/dotnet5crud --tail=100
        throw "Initial deployment rollout failed."
      }

      # Ensure the Service exists
      & $oc get service dotnet5crud *> $null

      if ($LASTEXITCODE -ne 0) {
        & $oc expose deployment/dotnet5crud `
          --port=8080 `
          --target-port=8080

        if ($LASTEXITCODE -ne 0) {
          throw "Failed to create Service."
        }
      }

      # Ensure the Route exists
      & $oc get route dotnet5crud *> $null

      if ($LASTEXITCODE -ne 0) {
        & $oc expose service/dotnet5crud

        if ($LASTEXITCODE -ne 0) {
          throw "Failed to create Route."
        }
      }

      # Verify the final rollout
      & $oc rollout status deployment/dotnet5crud --timeout=180s

      if ($LASTEXITCODE -ne 0) {
        & $oc get pods
        & $oc logs deployment/dotnet5crud --tail=100
        throw "Deployment rollout failed."
      }

      & $oc get deployment,pods,services,routes

      Write-Host "OpenShift deployment completed successfully."
      Write-Host "Image deployed: $image"
  env:
    OPENSHIFT_TOKEN: $(OPENSHIFT_TOKEN)
