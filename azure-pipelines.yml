```yaml
trigger:
  branches:
    include:
      - main

pool:
  name: 'default'

variables:
  buildConfiguration: 'Release'
  imageName: 'dotnet5crud'
  imageTag: '$(Build.BuildId)'

steps:

# ==========================================
# 1. Install .NET 8 SDK
# ==========================================
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# ==========================================
# 2. Verify .NET
# ==========================================
- script: |
    dotnet --version
    dotnet --list-sdks
    dotnet --list-runtimes
  displayName: 'Verify .NET installation'

# ==========================================
# 3. Restore NuGet packages
# ==========================================
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: 'DotNet5Crud.csproj'

# ==========================================
# 4. Build application
# ==========================================
- task: DotNetCoreCLI@2
  displayName: 'Build .NET application'
  inputs:
    command: 'build'
    projects: 'DotNet5Crud.csproj'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# ==========================================
# 5. Build Docker image
# ==========================================
- task: Docker@2
  displayName: 'Build Docker image'
  inputs:
    command: 'build'
    Dockerfile: 'Dockerfile'
    buildContext: '$(Build.SourcesDirectory)'
    repository: '$(imageName)'
    tags: |
      $(imageTag)
      latest

# ==========================================
# 6. Verify Docker image
# ==========================================
- script: |
    docker images
    docker image inspect $(imageName):$(imageTag)
  displayName: 'Verify Docker image'
```
